[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-telemetry-arrhythmia-engine"
version = "2.0.0"
description = "TelePulse: Autonomous Inpatient Continuous Telemetry Arrhythmia Supervisor"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ecg-telemetry-arrhythmia-engine = "ecg_telemetry_arrhythmia_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/ecg-telemetry-arrhythmia-engine"
Repository = "https://github.com/abusuraihsakhri/ecg-telemetry-arrhythmia-engine.git"
